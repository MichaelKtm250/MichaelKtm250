<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Thank You</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .thank-you-box {
      text-align: center;
      padding: 40px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    h1 {
      color: #0d1b2a; /* deep navy */
    }
    p {
      color: #333;
      margin-top: 10px;
    }
    a {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      background: #0d1b2a; /* button in theme color */
      color: #fff;
      padding: 12px 20px;
      border-radius: 4px;
    }
    a:hover {
      background: #cfd8dc; /* lighter accent */
      color: #0d1b2a;
    }
  </style>
</head>
<body>
  <div class="thank-you-box">
    <h1>Thank You!</h1>
    <p>Your message has been sent successfully. I’ll get back to you soon.</p>
    <a href="index.html">Back to Home</a>
  </div>
</body>
</html>
